[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tracefokus"
version = "2.0.0"
description = "Local synchronized observable-behavior research platform"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<2", "pandas>=2.2,<3", "PyYAML>=6,<7", "opencv-contrib-python>=4.8,<4.12", "mediapipe==0.10.21", "scikit-learn>=1.5,<1.8", "joblib>=1.4,<2"]
[project.optional-dependencies]
training = ["torch>=2.5,<3", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
